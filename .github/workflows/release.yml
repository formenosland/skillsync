name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v[0-9]*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
      url: ${{ steps.archive.outputs.url }}
      sha256: ${{ steps.archive.outputs.sha256 }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Check out branch for bump
        if: github.event_name == 'workflow_dispatch'
        run: git checkout "${GITHUB_REF_NAME}"

      - name: Bump version
        if: github.event_name == 'workflow_dispatch'
        id: bump
        uses: cocogitto/cocogitto-action@9a9fe03b31c47444290c0d7f9b1ee1b44ee13f20 # v4.1.0
        with:
          command: bump
          args: --auto
          # github-actions[bot] user id 41898282; GitHub noreply form so
          # the bump commit is attributed to the Actions bot.
          # https://api.github.com/users/github-actions%5Bbot%5D
          git-user: github-actions[bot]
          git-user-email: 41898282+github-actions[bot]@users.noreply.github.com

      - name: Push bump commit and tag
        if: github.event_name == 'workflow_dispatch'
        run: |
          set -eu
          v="${{ steps.bump.outputs.version }}"
          v="${v#v}"
          git push origin HEAD
          git push origin "v${v}"
          echo "tag=v${v}" >> "$GITHUB_OUTPUT"
        id: pushed

      - name: Resolve tag
        id: meta
        run: |
          set -eu
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            tag="${{ steps.pushed.outputs.tag }}"
          else
            tag="${GITHUB_REF_NAME}"
          fi
          version="${tag#v}"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Changelog for GitHub Release
        id: notes
        uses: cocogitto/cocogitto-action@9a9fe03b31c47444290c0d7f9b1ee1b44ee13f20 # v4.1.0
        with:
          command: changelog
          args: --at ${{ steps.meta.outputs.tag }} -t full_hash

      - name: Source archive sha256
        id: archive
        env:
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          set -eu
          url="https://github.com/${GITHUB_REPOSITORY}/archive/refs/tags/${TAG}.tar.gz"
          i=0
          while [ "$i" -lt 15 ]; do
            if curl -fsSL "$url" -o /tmp/skillsync-src.tar.gz; then
              break
            fi
            i=$((i + 1))
            sleep 2
          done
          [ -f /tmp/skillsync-src.tar.gz ] || {
            echo "could not download $url" >&2
            exit 1
          }
          sha=$(sha256sum /tmp/skillsync-src.tar.gz | awk '{print $1}')
          echo "sha256=$sha" >> "$GITHUB_OUTPUT"
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Write release notes
        env:
          NOTES: ${{ steps.notes.outputs.stdout }}
          SHA: ${{ steps.archive.outputs.sha256 }}
          URL: ${{ steps.archive.outputs.url }}
        run: |
          {
            printf '%s\n' "$NOTES"
            printf '\n## Homebrew\n\n'
            printf 'Tagged source archive (GitHub generates this; it is not a '
            printf 'Release asset). The Release workflow passes these to '
            printf 'formenosland/homebrew-tap `.github/workflows/bump.yml`:\n\n'
            printf '```\n%s\nsha256 %s\n```\n' "$URL" "$SHA"
          } > GITHUB_CHANGELOG.md

      - name: GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.tag }}
          body_path: GITHUB_CHANGELOG.md
          generate_release_notes: false

  bump-tap:
    needs: release
    uses: formenosland/homebrew-tap/.github/workflows/bump.yml@main
    with:
      kind: formula
      name: skillsync
      version: ${{ needs.release.outputs.version }}
      url: ${{ needs.release.outputs.url }}
      sha256: ${{ needs.release.outputs.sha256 }}
    secrets:
      HOMEBREW_TAP_APP_ID: ${{ secrets.HOMEBREW_TAP_APP_ID }}
      HOMEBREW_TAP_APP_PRIVATE_KEY: ${{ secrets.HOMEBREW_TAP_APP_PRIVATE_KEY }}
