name: CI

on:
  push:
  pull_request:

jobs:
  conventional:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          fetch-tags: true
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Conventional commits
        uses: cocogitto/cocogitto-action@9a9fe03b31c47444290c0d7f9b1ee1b44ee13f20 # v4.1.0
        with:
          command: check
          args: --from-latest-tag

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@0a12ed9d6a96ab950c8f026ed9f722fe0da7ef32 # v5.0.2
        with:
          go-version: "1.22.x"
      - name: Go tests
        env:
          CGO_ENABLED: "0"
        run: go test ./...

  agentregistry-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@0a12ed9d6a96ab950c8f026ed9f722fe0da7ef32 # v5.0.2
        with:
          go-version: "1.22.x"
      - name: Regenerate at pinned SHA and diff
        env:
          CGO_ENABLED: "0"
        run: |
          SHA=$(sed -n 's/^# Upstream:.* @ //p' internal/agentregistry/agents.tsv | head -1)
          cp internal/agentregistry/agents.tsv /tmp/agents.tsv.orig
          go run ./internal/agentregistry/gen "$SHA"
          diff -u <(grep -v '^# Generated:' /tmp/agents.tsv.orig) <(grep -v '^# Generated:' internal/agentregistry/agents.tsv)
