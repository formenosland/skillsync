name: CI

on:
  push:
  pull_request:

env:
  # Keep in sync with Makefile SHELLCHECK_VERSION
  SHELLCHECK_VERSION: "0.11.0"

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: ShellCheck
        uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38 # 2.0.0
        with:
          version: v${{ env.SHELLCHECK_VERSION }}
          check_together: "yes"
          # bin/skillsync has no .sh suffix
          additional_files: skillsync

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install ShellCheck ${{ env.SHELLCHECK_VERSION }}
        run: |
          version="v${SHELLCHECK_VERSION}"
          case "$(uname -s)-$(uname -m)" in
            Linux-x86_64) triplet=linux.x86_64 ;;
            Linux-aarch64|Linux-arm64) triplet=linux.aarch64 ;;
            Darwin-x86_64) triplet=darwin.x86_64 ;;
            Darwin-arm64) triplet=darwin.aarch64 ;;
            *) echo "unsupported runner: $(uname -s) $(uname -m)" >&2; exit 1 ;;
          esac
          curl -fsSL "https://github.com/koalaman/shellcheck/releases/download/${version}/shellcheck-${version}.${triplet}.tar.xz" \
            | sudo tar -xJ --strip-components=1 -C /usr/local/bin "shellcheck-${version}/shellcheck"
          shellcheck --version
      - run: tests/run.sh

  registry-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Regenerate at pinned SHA and diff
        run: |
          SHA=$(sed -n 's/^# Upstream:.* @ //p' registry/agents.tsv | head -1)
          cp registry/agents.tsv /tmp/agents.tsv.orig
          registry/generate.sh "$SHA"
          diff -u <(grep -v '^# Generated:' /tmp/agents.tsv.orig) <(grep -v '^# Generated:' registry/agents.tsv)
