name: CI

on:
  push:
  pull_request:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y shellcheck
      - run: shellcheck -s sh bin/skillsync install.sh registry/generate.sh tests/run.sh

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: |
          if [ "$(uname -s)" = Linux ]; then
            sudo apt-get update && sudo apt-get install -y shellcheck
          else
            brew install shellcheck
          fi
      - run: tests/run.sh

  registry-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Regenerate at pinned SHA and diff
        run: |
          SHA=$(sed -n 's/^# Upstream:.* @ //p' registry/agents.tsv | head -1)
          cp registry/agents.tsv /tmp/agents.tsv.orig
          registry/generate.sh "$SHA"
          diff -u <(grep -v '^# Generated:' /tmp/agents.tsv.orig) <(grep -v '^# Generated:' registry/agents.tsv)
