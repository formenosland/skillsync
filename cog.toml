# https://docs.cocogitto.io/reference/config
from_latest_tag = true
ignore_merge_commits = true
tag_prefix = "v"
branch_whitelist = ["main"]

pre_bump_hooks = [
	"""
	tmp=$(mktemp)
	sed 's/^const Version = \".*\"/const Version = \"{{version}}\"/' internal/cli/app.go > "$tmp"
	mv "$tmp" internal/cli/app.go
	git add internal/cli/app.go
	""",
]

post_bump_hooks = []

[commit_types]
chore = { omit_from_changelog = true }
test = { omit_from_changelog = true }
ci = { omit_from_changelog = true }

[changelog]
path = "CHANGELOG.md"
template = "remote"
remote = "github.com"
owner = "formenosland"
repository = "skillsync"
