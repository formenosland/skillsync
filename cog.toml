# https://docs.cocogitto.io/reference/config
from_latest_tag = true
ignore_merge_commits = true
tag_prefix = "v"
branch_whitelist = ["main"]

pre_bump_hooks = [
	"""
	tmp=$(mktemp)
	sed 's/^VERSION=.*/VERSION="{{version}}"/' bin/skillsync > "$tmp"
	mv "$tmp" bin/skillsync
	git add bin/skillsync
	""",
]

post_bump_hooks = []

[commit_types]
chore = { omit_from_changelog = true }
test = { omit_from_changelog = true }
ci = { omit_from_changelog = true }

[changelog]
path = "CHANGELOG.md"
template = "remote"
remote = "github.com"
owner = "formenosland"
repository = "skillsync"
